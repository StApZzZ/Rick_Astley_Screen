# Inside the server {} block of the existing site.
# The trailing slash in proxy_pass strips /rick/ before the request reaches the container.
location = /rick {
    return 301 /rick/;
}
location /rick/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Video seeking uses Range requests: pass them through untouched.
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
}

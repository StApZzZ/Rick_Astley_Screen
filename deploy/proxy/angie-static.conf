# Variant B for Angie (the same lines work in nginx): the built files copied to
# /var/www/site/rick/, no container.

# In the http {} block. (A nested location with its own add_header would drop
# every header of the outer one, hence the map.)
map $uri $rick_cache_control {
    ~^/rick/assets/  "public, max-age=31536000, immutable";
    ~^/rick/media/   "public, max-age=86400";
    default          "no-cache";
}

# In the server {} block.
location = /rick {
    return 301 /rick/;
}
location ^~ /rick/ {
    root /var/www/site;          # the files are in /var/www/site/rick/ (root, not alias: alias + try_files misbehaves)
    try_files $uri $uri/ =404;

    # Add the CDN origin to media-src and connect-src if the clip lives there.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "fullscreen=(self), screen-wake-lock=(self), autoplay=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $rick_cache_control always;
}

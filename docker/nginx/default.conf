# Rick Astley Screen: a static site on nginx-unprivileged (port 8080, uid 101).
# The pieces that depend on the deployment (config.json, the CSP, the base path)
# are rendered into /tmp/rickroll at start-up by
# /docker-entrypoint.d/40-rickroll-config.sh, so the root filesystem can stay read-only.

# HSTS only when the proxy in front terminated TLS.
map $http_x_forwarded_proto $rickroll_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Relative Location headers: correct behind any proxy and under any sub-path.
    absolute_redirect off;

    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /tmp/rickroll/base-path.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.json {
        alias /tmp/rickroll/config.json;
        default_type application/json;
        include /etc/nginx/snippets/rickroll-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's content-hashed bundles.
    location ^~ /assets/ {
        include /etc/nginx/snippets/rickroll-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Same-origin media (Docker / static hosting). Ranges are served natively.
    location ^~ /media/ {
        include /etc/nginx/snippets/rickroll-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/rickroll-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

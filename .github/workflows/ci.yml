name: ci

# Pull requests run it directly; pushes to main run it through release.yml
# (the image is only promoted when this passes).
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures and provenance
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - name: Shell scripts
        run: shellcheck -s sh docker/entrypoint/*.sh scripts/*.sh

  e2e:
    name: container + browser tests
    runs-on: ubuntu-24.04
    needs: checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: rick-astley-screen:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
      - name: Start it the way production runs it (read-only, no capabilities)
        run: |
          mkdir -p "$RUNNER_TEMP/media"
          cp tests/fixtures/clip.mp4 "$RUNNER_TEMP/media/never-gonna-give-you-up.mp4"
          docker run -d --name app -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp:size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/media:/usr/share/angie/html/media:ro" rick-astley-screen:ci
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Smoke test (endpoints, headers, ranges)
        run: scripts/smoke.sh http://localhost:8080/
      - name: Playwright (Chromium, Firefox) against the container
        run: |
          image=$(sed -n 's/^FROM \(.*\) AS playwright$/\1/p' .github/tool-images.Dockerfile)
          docker run --rm --network host --ipc=host -e CI=1 -e E2E_BASE_URL=http://localhost:8080/ \
            -v "$PWD:/work" -w /work "$image" \
            sh -c 'npm ci --ignore-scripts && npx playwright test'
      - name: Container log
        if: failure()
        run: docker logs app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# DAST only: TLS in front of the container under test, the way deployments run it
# behind a proxy. default_server answers clients that send no SNI (Java, i.e. ZAP,
# sends none for "localhost").
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/angie.pid;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8443 ssl default_server;
        http2 on;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Same refusal as the app itself: a proxy that let OPTIONS/TRACE through
        # (Max-Forwards) would show up as a separate hop.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

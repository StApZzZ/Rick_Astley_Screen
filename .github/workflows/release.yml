name: release

# main and version tags: test, build once, scan the pushed digest (Trivy, DAST),
# and only then sign it and move the tags. Deployments pull the signed digest
# themselves (cosign verify against this workflow's identity on refs/heads/main):
# nothing here knows or reaches any server.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/stapzzz/rick-astley-screen

jobs:
  ci:
    name: ci
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  security:
    name: security
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/security.yml

  build:
    name: build and push (unsigned, sha tag)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v=${REF_NAME#v}; else v="0.0.0-main.${GITHUB_SHA::12}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 + linux/arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

  scan:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan the pushed digest
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          image=$(sed -n 's/^FROM \(.*\) AS trivy$/\1/p' .github/tool-images.Dockerfile)
          docker pull --platform linux/amd64 "$REF"
          run() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            -v trivy-cache:/root/.cache "$image" image --image-src docker "$@"; }
          run --format sarif --output /out/trivy-image.sarif "$REF"
          run --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$REF"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  dast:
    name: DAST (smoke, ZAP baseline + full scan)
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the pushed digest (read-only, no capabilities)
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/media"
          cp tests/fixtures/clip.mp4 "$RUNNER_TEMP/media/never-gonna-give-you-up.mp4"
          docker run -d --name app -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp:size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/media:/usr/share/angie/html/media:ro" "$REF"
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Smoke test
        run: scripts/smoke.sh http://localhost:8080/
      # Deployments terminate TLS in a proxy: scan through one (Angie with a
      # throwaway self-signed certificate), so HSTS and the HTTPS rules run too.
      - name: TLS proxy in front
        run: |
          image=$(sed -n 's/^FROM \(.*\) AS angie$/\1/p' .github/tool-images.Dockerfile)
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost \
            -keyout "$tls/tls.key" -out "$tls/tls.crt" 2>/dev/null
          chmod 0644 "$tls/tls.key"
          docker run -d --name tls --network host --user 100:101 -v "$tls:/tls:ro" \
            -v "$PWD/.github/dast/angie-tls.conf:/etc/angie/angie.conf:ro" "$image" angie -g 'daemon off;'
          for _ in $(seq 30); do curl -ksfS https://localhost:8443/healthz && break; sleep 1; done
          SMOKE_CURL_OPTS=-k scripts/smoke.sh https://localhost:8443/
      - name: ZAP baseline (spider + passive rules)
        run: |
          image=$(sed -n 's/^FROM \(.*\) AS zap$/\1/p' .github/tool-images.Dockerfile)
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R a+rwX zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$image" \
            zap-baseline.py -t https://localhost:8443/ -j -a -c rules.tsv -r baseline.html -J baseline.json
      - name: ZAP full scan (active attacks)
        run: |
          image=$(sed -n 's/^FROM \(.*\) AS zap$/\1/p' .github/tool-images.Dockerfile)
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$image" \
            zap-full-scan.py -t https://localhost:8443/ -j -a -m 5 -c rules.tsv -r full.html -J full.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-reports
          path: zap/*.html
          retention-days: 30

  promote:
    name: sign, attest, tag
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [ci, security, build, scan, dast]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Sigstore) and provenance
      attestations: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the digest (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      # Tags move only after the signature exists: whoever follows a tag never
      # sees an unsigned digest behind it.
      - name: Move the tags
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            minor=${VERSION%.*}; major=${VERSION%%.*}
            set -- -t "$IMAGE:$VERSION" -t "$IMAGE:$minor" -t "$IMAGE:$major"
          else
            set -- -t "$IMAGE:main" -t "$IMAGE:latest"
          fi
          docker buildx imagetools create "$@" "$REF"
          echo "### Promoted \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub release (static bundle)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: promote
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false # a released artifact must not come from a cache
      - name: Build the static bundle
        run: |
          npm ci --ignore-scripts
          npm run build
          tar -C dist -czf rick-astley-screen-dist.tar.gz .
          sha256sum rick-astley-screen-dist.tar.gz > rick-astley-screen-dist.tar.gz.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rick-astley-screen-dist.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes \
            rick-astley-screen-dist.tar.gz rick-astley-screen-dist.tar.gz.sha256

# Ingress only on the HTTP port, no egress at all: the pod serves files and
# never needs to call anything. Egress is listed with no rules (= deny all) rather
# than `egress: []`, which the API server drops and GitOps tools then report as drift.
# (Enforced only where the CNI supports it.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rick-astley-screen
spec:
  podSelector:
    matchLabels: { app: rick-astley-screen }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8080, protocol: TCP }]
